<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>旧阶梯搬到项目二</title>
<style>
  body { margin: 0; background: #f4f0e6; color: #1c1915; font-family: "Palatino Linotype", Palatino, "Songti SC", serif; line-height: 1.55; }
  main { max-width: 760px; margin: 0 auto; padding: 42px 22px 72px; }
  h1 { font-size: 1.7rem; line-height: 1.3; font-weight: 600; }
  .kicker { font-family: "Segoe UI", sans-serif; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #9a3412; }
  svg { width: 100%; height: auto; }
  .note { color: #5c564c; font-size: 0.92rem; }
</style>
</head>
<body>
<main>
  <p class="kicker">H5 · 2026-10-17</p>
  <h1>按连续失败升级，会在项目二里给过头</h1>
  <p>上一把阶梯只看「同一项连续没通过几次」。把它原样放到活动 2.2 和 2.3 的 12 个新决策点上，过度帮助率是 0.417，始终给第 2 级是 0.667。两边都没有把学生自选的购票系统写出来。</p>
  <svg viewBox="0 0 640 200" role="img" aria-label="项目二决策点上的过度帮助率">
    <rect width="640" height="200" fill="#fffaf3" rx="12" stroke="#e2d8c8"/>
    <text x="24" y="32" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="13">项目二 · 过度帮助率</text>
    <text x="168" y="78" font-size="14">始终第 2 级</text>
    <rect x="280" y="60" width="267" height="22" fill="#9a3412" rx="4"/>
    <text x="556" y="76" font-family="Segoe UI, sans-serif" font-size="13">0.667</text>
    <text x="168" y="128" font-size="14">连续失败阶梯</text>
    <rect x="280" y="110" width="167" height="22" fill="#92400e" rx="4"/>
    <text x="456" y="126" font-family="Segoe UI, sans-serif" font-size="13">0.417</text>
    <text x="24" y="176" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="12">这 12 条和上一轮编程式决策点不是同一批，两个比例不能连成进步曲线。</text>
  </svg>
  <p>阶梯给到第 4 级的两处，正是这册书不该给例子的时候：其他四类已经填对、只剩一类；活动 2.3 还在抄「新卡充值」。后一种情况里，第 4 级的句子本身又是一条充值例子。</p>
  <p class="note">决策点是按教学判断写的，不是学生作业。下一条规则如果要看「是不是只剩一类」和「是不是还在抄充值」，得用写完规则之后才准备的新决策点来测。</p>
</main>
</body>
</html>
