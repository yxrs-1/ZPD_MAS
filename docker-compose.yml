services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zpd
      POSTGRES_PASSWORD: zpd
      POSTGRES_DB: zpd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zpd -d zpd"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:1.0.0
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/data

  api:
    image: zpd-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://zpd:zpd@postgres:5432/zpd
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      UPLOAD_DIR: /data/uploads
      CLASSROOM_DIR: /data
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      HF_ENDPOINT: https://hf-mirror.com
      PYTHONPATH: /app/backend/src:/app/src
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data
      - models:/models
      - ./backend/src:/app/backend/src
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started

  worker:
    image: zpd-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "celery", "-A", "zpd_api.worker.celery_app", "worker", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://zpd:zpd@postgres:5432/zpd
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      UPLOAD_DIR: /data/uploads
      CLASSROOM_DIR: /data
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      HF_ENDPOINT: https://hf-mirror.com
      PYTHONPATH: /app/backend/src:/app/src
    volumes:
      - uploads:/data
      - models:/models
      - ./backend/src:/app/backend/src
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chroma:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  chromadata:
  uploads:
  models:
